parameters:
  PaginationLimit:
    name: limit
    in: query
    description: Số lượng bản ghi tối đa trả về trên một trang. Max 500.
    required: false
    schema:
      type: integer
      default: 20
      maximum: 500
  PaginationOffset:
    name: offset
    in: query
    description: Vị trí bắt đầu lấy dữ liệu.
    required: false
    schema:
      type: integer
      default: 0
  CorrelationId:
    name: X-Correlation-ID
    in: header
    description: UUID dùng để trace request xuyên suốt hệ thống.
    required: false
    schema:
      type: string
      format: uuid
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    description: Bắt buộc truyền UUID để chống double-charge trên các request tạo dữ liệu mới.
    required: true
    schema:
      type: string
      format: uuid
